<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enrollment Form</title>

    <link rel="stylesheet" href="skill.css">
</head>

<body>

    <div class="container">

        <div class="hero">
            <h1>Ready to Level Up?</h1>
            <h2>Enroll Now! 🚀</h2>
            <p>
                Master the skills that matter.
                Whether you're starting or leveling up,
                we've got the course for you!
            </p>
        </div>

        <form id="enrollmentForm">

            <!-- Full Name -->
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your Full Name"
                required
            >

            <!-- Email -->
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your Email"
                required
            >

            <!-- Phone -->
            <label for="phone">Phone Number</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="+977"
                required
            >
            <!-- Address -->
            <label for="address">Address</label>
            <input
                type="text"
                id="address"
                name="address"
                placeholder="Enter your Address"
            >
            <!-- Course -->
            <label for="course">Course</label>

            <select id="course" name="course">
                <option value="">Select your course</option>
                <option value="JRP">JRP</option>
                <option value="Diploma">Diploma</option>
                <option value="SEE">SEE</option>
                <option value="+2">+2</option>
            </select>

            <!-- Education -->
            <label for="education">Education Level</label>

            <select id="education" name="education">
                <option value="">Select your education level</option>
                <option value="SEE">SEE</option>
                <option value="+2">+2</option>
                <option value="Bachelor">Bachelor</option>
                <option value="Master">Master</option>
            </select>
            <!-- Learning Format -->
            <label>Preferred Learning Format</label>

            <div class="radio-group">

                <label>
                    <input
                        type="radio"
                        name="format"
                        value="Physical"
                    >
                    Physical
                </label>

                <label>
                    <input
                        type="radio"
                        name="format"
                        value="Online"
                    >
                    Online
                </label>

                <label>
                    <input
                        type="radio"
                        name="format"
                        value="Hybrid"
                    >
                    Hybrid
                </label>

            </div>

            <!-- Laptop -->
            <label>Do you have a Laptop?</label>

            <div class="radio-group">

                <label>
                    <input
                        type="radio"
                        name="laptop"
                        value="Yes"
                    >
                    Yes
                </label>
                <label>
                    <input
                        type="radio"
                        name="laptop"
                        value="No"
                    >
                    No
                </label>

            </div>
            <!-- How did you find us -->
            <label for="source">How did you find us?</label>

            <select id="source" name="source">
                <option value="">Select an option</option>
                <option value="Facebook">Facebook</option>
                <option value="Instagram">Instagram</option>
                <option value="Friend">Friend</option>
                <option value="Google">Google</option>
            </select>
              <!-- Referral -->
            <label>Received any referrals?</label>
            <div class="radio-group">

                <label>
                    <input
                        type="radio"
                        name="referral"
                        value="Yes"
                    >
                    Yes
                </label>

                <label>
                    <input
                        type="radio"
                        name="referral"
                        value="No"
                    >
                    No
                </label>
            </div>
            <button type="submit">
                Submit Now
            </button>
        </form>
    </div>
    <script src="skill.js"></script>
</body>
</html>
