<!DOCTYPE html>
<html>
<head>
    <title>Music App</title>
    <style>
        body {
            margin: 0;
        }
        .container {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-rows: 1fr 60px;
            height: 100vh;
        }
        aside {
            background-color: lightgray;
            grid-row: 1 / 3;
            padding: 20px;
        }
        main {
            background-color: lightblue;
            padding: 20px;
        }
        footer {
            background-color: lightgreen;
           padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside>
            <h2>Library</h2>
            <p>Home</p>
            <p>Search</p>
            <p>Playlist</p>
        </aside>
        <main>
            <h1>My Music</h1>
            <p>Welcome to my music app.</p>
        </main>
        <footer>
            <button>⏮</button>
            <button>▶</button>
            <button>⏭</button>
        </footer>
    </div>
</body>
</html>
