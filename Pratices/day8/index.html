<!DOCTYPE html>
<html>
<head>
    <style>
        .outer-box {
            width: 400px;
            height: 300px;
            border: 2px solid black;
            position: relative;
        }

        .inner-box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>
    <div class="outer-box">
        <div class="inner-box"></div>
    </div>

</body>
</html>
